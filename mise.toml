# This repo's own tools and tasks, hand-written until a template applies itself here.
min_version = "2026.7.2"

[env]
TY_CONFIG_FILE = "{{config_root}}/.config/ty.toml"

[tools]
uv = "0.13.4"
ruff = "0.17.1"
ty = "0.0.90"
prek = "0.5.7"
"github:kjanat/actionlint" = "1.17.0"
"github:EtaCassiopeia/lid-tooling" = { version = "0.3.0", asset_pattern = "lidc-x86_64-unknown-linux-gnu" }
# Renovate runs as a CLI in the preset tests; this Renovate release needs Node 24.
node = "24.22.1"
# mise's npm installer (aube) refuses a dependency whose provenance is weaker than an earlier
# release's. @yarnpkg/libzip 3.2.2 was published by a Yarn maintainer without provenance, from
# the yarnpkg/berry release commit 2eb9830716 (checked 2026-10-12).
"npm:renovate" = { version = "44.172.2", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[tasks.setup]
run = ["mise install", "prek install -c .config/prek.toml"]

[tasks.sync]
run = "uv sync --locked --all-extras --all-groups"

[tasks.lint]
run = """
status=0
ruff check || status=1
ruff format --check || status=1
actionlint .github/workflows/*.yml || status=1
exit $status
"""

[tasks.typecheck]
depends = ["sync"]
run = "ty check"

[tasks.test]
depends = ["sync"]
run = "uv run --locked pytest"

[tasks.lid]
run = "lidc check --only reverse-orphan,coverage,spec-id-format --fail-on warning"

[tasks.conflicts]
run = """
status=0
git grep -nE '^(<<<<<<<|>>>>>>>) ' -- ':/' || status=$?
case $status in
  0) echo "conflict markers found" >&2; exit 1 ;;
  1) exit 0 ;;
  *) exit "$status" ;;
esac
"""

[tasks.fix]
run = ["ruff check --fix", "ruff format"]

[tasks.hooks]
run = "prek run -c .config/prek.toml --all-files"

[tasks.check]
depends = ["lint", "typecheck", "test", "lid", "conflicts"]
