schema_version: "1.1"
name: harvester-literature
description: >-
  A full-method search on an approach need sends its arXiv and OpenAlex keyword searches, its
  OpenAlex citation lookups and any Semantic Scholar recommendations or title lookups through the
  skill's harvester, sends Semantic Scholar no keyword search, checks a title lookup's match, with one run directory
  shared by every subagent, works from the harvester's printed summary rather than its files, keeps a
  route searched once any invocation searched it, and doesn't send those requests itself or re-invoke
  a throttled service within the same round.
context:
  scaffold_script: scaffold.sh
