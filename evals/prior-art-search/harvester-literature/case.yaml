schema_version: "1.1"
name: harvester-literature
description: >-
  A full-method search on an approach need sends every request to the arXiv, OpenAlex and Semantic
  Scholar APIs through the skill's harvester (keyword searches, arXiv's newest preprints, lookups
  by arXiv ID or DOI, OpenAlex citation and related-works lookups, Semantic Scholar recommendations
  and title lookups), requests only full text from arxiv.org, sends Semantic Scholar no keyword
  search, checks a title lookup's match, with one run directory
  shared by every subagent, works from the harvester's printed summary rather than its files, keeps a
  route searched once any invocation searched it, and doesn't send those requests itself or re-invoke
  a throttled service within the same round, where a round is later only once the agent has finished
  its current one and run a query seeded by a new serious candidate, whatever number it passes as
  --round.
context:
  scaffold_script: scaffold.sh
