name: loose-ends-sweep
description: >-
  The sweep lists what the session leaves open, each checked against the repo: unkept promises, a
  deferred fix, a parked question, a job it can't check and a draft still needed. It drops what is
  done or dismissed, and separates the session's uncommitted files from the rest.
