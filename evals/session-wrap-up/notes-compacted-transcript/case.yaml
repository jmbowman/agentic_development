# @spec WRAP-RUN-016, WRAP-NOTES-010
schema_version: "1.1"
name: notes-compacted-transcript
description: >-
  After a compaction, with the transcript's location stated, the run finds the counting lines (the
  `[subagent-notes]` line a hook adds after each launch) that the transcript marks as hook context, and the earlier report that read one notes file. It skips that
  file, reads the notes of the agent launched after the report, and ignores a counting line quoted
  in a tool result.
context:
  scaffold_script: scaffold.sh
