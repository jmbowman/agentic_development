[project]
name = "agentic-development"
version = "0.0.0"
description = "Shared CI workflow and Renovate preset for the agentic development system, with their tests"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "pyyaml==6.0.3"]

[tool.uv]
package = false
# The repo root is a Claude Code plugin, and `claude plugin eval` refuses a plugin containing
# hard-linked files, which uv's default link mode creates throughout .venv.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
# An empty parametrize list fails instead of skipping, so a broken data source can't pass silently.
empty_parameter_set_mark = "fail_at_collect"
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "network: needs network access beyond tools already installed",
    "renovate: runs the Renovate CLI pinned in mise.toml",
]
